# THROWAWAY probe — never merge; dropped before this PR merges. Runs the real
# resolve_redirect() from a runner against live Google News article links to
# confirm the batchexecute decode (issue #42) actually resolves from a
# datacenter IP (the plain redirect did not — 0/106 in the last live refresh).
name: Decode probe (throwaway)

on:
  pull_request:
    paths:
      - .github/workflows/decode-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Pull a few live Google News article links, then decode them
        working-directory: pipeline
        run: |
          python - <<'EOF'
          import pull_news, config
          # Grab real, current article links from the configured Google feed.
          cfg = next(c for c in config.NEWS_FEEDS if c["kind"] == "google_news")
          raw = pull_news.fetch_feed(cfg["url"])
          items = pull_news.parse_feed(raw, cfg["source"], cfg["kind"]) or []
          gurls = [i["url"] for i in items if "news.google.com" in i["url"]][:5]
          print(f"testing {len(gurls)} live google links\n")
          ok = 0
          for u in gurls:
              out = pull_news.resolve_redirect(u)
              resolved = "news.google.com" not in out
              ok += resolved
              print(("RESOLVED " if resolved else "UNRESOLVED ") + out[:120])
          print(f"\n=== {ok}/{len(gurls)} decoded to publisher URLs ===")
          EOF
