# Runs the Python test suite on every pull request and on every push to main.
#
# Deliberately a separate workflow from data-guard.yml. That workflow answers
# "is this data real?" and is path-filtered to site/data, site/api and pipeline.
# This one answers "does the code still work?" and must run unfiltered, so the
# check is always reported and can be made a required check without the
# skipped-required-check problem. Keeping them apart also keeps the provenance
# guard fast: it needs only stdlib plus jsonschema, while this job installs
# geopandas, shapely and pyproj.
#
# Was deferred once already — see docs/superpowers/cost-savings-orchestration.md
# (Phase 4 note). This is that standalone PR.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # requirements-dev.txt pulls in requirements.txt with `-r`, so hash
          # both — otherwise a runtime-dep bump would reuse a stale cache.
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r pipeline/requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest pipeline/tests -q

  # tests/ui/*.test.js are plain node scripts with no package.json and no runner
  # (AGENTS.md). They ran in no workflow until this job existed, so a change to
  # site/assets/js/ could go green on every check while the page was broken --
  # which nearly happened: the skill URL reached home.js and contributing.js
  # before anything executed them in CI.
  #
  # A SEPARATE job on purpose. It cannot slow or break the pytest check above,
  # which is the one that may already be a required check.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the UI model tests
        run: |
          shopt -s nullglob
          files=(tests/ui/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tests/ui/*.test.js files found -- this job is guarding nothing"
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "--- $f"
            # Do not stop at the first failure: one run should show them all.
            # AGENTS.md's documented loop masks a mid-loop failure, because a
            # bare for-loop exits with the status of its LAST iteration.
            node "$f" || { echo "::error file=$f::UI model test failed"; fail=1; }
          done
          exit $fail
